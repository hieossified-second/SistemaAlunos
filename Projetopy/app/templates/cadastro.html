<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="Caixa">
        <h1 class="caixaMenor">Cadastro de Aluno</h1>

        <div class="caixa">
            <form action="/cadastro" method="POST">

                <label class="CorPreta">Nome:</label>
                <input type="text" name="nome" required>

                <br><br>

                <label class="CorPreta">Idade:</label>
                <input type="number" name="idade" required>

                <br><br>

                <label class="CorPreta">Nota 1:</label>
                <input type="number" step="0.01" name="n1" required>

                <br><br>

                <label class="CorPreta">Nota 2:</label>
                <input type="number" step="0.01" name="n2" required>

                <br><br>

                <label class="CorPreta">Nota 3:</label>
                <input type="number" step="0.01" name="n3" required>

                <br><br>

                <button type="submit">Cadastrar</button>
            </form>
            
            <a href="/">
                <button>Voltar</button>
            </a>
        </div>
    </div>    

</body>

</html>
